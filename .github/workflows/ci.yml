name: CI

# The PSoXide SDK is vendored under `psoxide/` and carries its own upstream
# workflow. This workflow gates the game.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap checks first and separately. A red fmt or clippy step used to abort the
  # build job before the logic suite ever ran, so a formatting slip silently
  # disabled the only test signal the project has.
  host:
    name: Host tests, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustup show

      # Scope the gate to this project's four crates. `cargo fmt --all` from the
      # game manifest walks the whole path-dependency graph, which now includes
      # the vendored SDK -- upstream code this repository does not reformat.
      - name: Check formatting
        run: |
          for m in game crates/plattypus-core tools/test_game_logic video_bench; do
            echo "::group::$m"
            cargo fmt --manifest-path "$m/Cargo.toml" --all -- --check
            echo "::endgroup::"
          done

      - name: Clippy
        run: |
          cargo clippy --locked --offline --manifest-path crates/plattypus-core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --offline --manifest-path tools/test_game_logic/Cargo.toml --all-targets -- -D warnings

      - name: Run host-side game logic tests
        run: cargo run --locked --offline --manifest-path tools/test_game_logic/Cargo.toml

      # `game/` and `video_bench/` both resolve crates.io dependencies and
      # video_bench textually includes the game's video.rs and audio.rs, so a
      # lockfile that disagrees on a registry dependency is the one way those two
      # binaries can diverge.
      - name: Lockfiles agree on registry dependencies
        run: |
          set -euo pipefail
          game_lockfile="/tmp/game.lock.reg"
          video_lockfile="/tmp/video_bench.lock.reg"
          extract_reg() {
            awk '
              /^\[\[package\]\]/ { if (reg && name && ver) print name, ver; name=""; ver=""; reg=0 }
              /^name = / { name=$3 }
              /^version = / { ver=$3 }
              /^source = "registry/ { reg=1 }
              END { if (reg && name && ver) print name, ver }
            ' "$1" | sort
          }
          extract_reg game/Cargo.lock > "$game_lockfile"
          extract_reg video_bench/Cargo.lock > "$video_lockfile"
          diff -u "$game_lockfile" "$video_lockfile"

  game:
    name: PSX build
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu

      - name: Show toolchain
        run: rustup show

      # MUST run with the working directory set to game/: the cross-build target
      # lives in game/.cargo/config.toml and Cargo only reads that from the cwd.
      - name: Build the PSX executable
        working-directory: game
        run: cargo build --release --locked

      - name: Verify the executable exists and fits the console
        working-directory: game
        run: |
          exe=target/mipsel-sony-psx/release/plattypus.exe
          test -f "$exe"
          size=$(stat -c%s "$exe")
          echo "exe = $size bytes ($(( size * 100 / 2097152 ))% of PS1 RAM)"
          if [ "$size" -ge 2097152 ]; then
            echo "::error::executable exceeds the 2 MB main RAM of a PlayStation"
            exit 1
          fi

  disc:
    name: Disc mastering smoke test
    needs: game
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu

      # Guards the Makefile's emulator path against regressing to a hardcoded
      # local path, and proves `make disc` can still master an image.
      - name: Master the disc image
        run: make disc

      # `make iso` is a separate product that the Pages workflow publishes, so
      # it cannot be left unbuilt here.
      - name: Master the ISO image
        run: make iso

      - name: Verify the cue names a file that exists
        run: |
          set -euo pipefail
          grep -q '^FILE' dist/plattypus.cue
          named=$(awk '/^FILE/{gsub(/"/,"",$2); print $2}' dist/plattypus.cue | head -1)
          echo "cue references: $named"
          test -f "$named" || test -f "dist/$(basename "$named")"
          ls -l dist/plattypus.bin dist/plattypus.cue dist/plattypus.iso