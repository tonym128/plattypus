name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build PS1 ISO & Disc Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MIPS bare-metal toolchain & zip
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu zip

      - name: Show toolchain
        run: rustup show

      - name: Run game logic test suite
        run: make test

      - name: Build PSX-EXE, Master Disc, and Cooked ISO
        run: |
          make disc
          make iso

      - name: Package Master Disc Zip & Checksums
        working-directory: dist
        run: |
          cp ../web/assets/MANUAL.md ./MANUAL.md
          cp ../web/assets/jewel_case_cover_ntsc.svg ./cover_art.svg
          zip -9 plattypus-ps1-master-disc.zip plattypus.bin plattypus.cue MANUAL.md cover_art.svg
          sha256sum plattypus.iso plattypus.exe plattypus.bin plattypus.cue plattypus-ps1-master-disc.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Plattypus PS1 - ${{ steps.vars.outputs.tag }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### 🎮 Plattypus (Sony PlayStation 1) - Release ${{ steps.vars.outputs.tag }}

            Tactical Espionage Action built from scratch for bare-metal Sony PlayStation 1 hardware using Rust and PSoXide.

            #### 📦 Downloads Included:
            - **`plattypus.iso`** (2 MB): Standard 2048-byte Mode 1 cooked ISO image for optical disc emulators and universal loaders.
            - **`plattypus-ps1-master-disc.zip`** (29 MB): Complete Red Book CD-ROM disc image (`.bin` + `.cue`) featuring full streaming CD-DA stereo music tracks, 15fps MDEC/XA cinematic videos, manual, and printable packaging art.
            - **`plattypus.bin` & `plattypus.cue`**: Raw multi-track disc image for burning to CD-R or loading in DuckStation / RetroArch.
            - **`plattypus.exe`** (614 KB): Standalone MIPS R3000 bare-metal executable for fast serial/network side-loading (Unirom/Caetla).
            - **`SHA256SUMS.txt`**: Cryptographic integrity hashes for all release binaries.

            #### 🕹️ Play Online in Your Browser:
            Play immediately without downloading on the [Plattypus Web Arcade](https://tonym128.github.io/plattypus/).
          files: |
            dist/plattypus.iso
            dist/plattypus-ps1-master-disc.zip
            dist/plattypus.exe
            dist/plattypus.bin
            dist/plattypus.cue
            dist/SHA256SUMS.txt
            web/assets/MANUAL.md
            web/assets/jewel_case_cover_ntsc.svg
            web/assets/jewel_case_back_ntsc.svg
            web/assets/disc_face_art.svg
