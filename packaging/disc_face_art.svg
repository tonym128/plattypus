<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Silver Disc Metallic Gradient -->
    <radialGradient id="disc-silver" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a20"/>
      <stop offset="35%" stop-color="#1f2c38"/>
      <stop offset="70%" stop-color="#2a3d4d"/>
      <stop offset="90%" stop-color="#1b2834"/>
      <stop offset="100%" stop-color="#101820"/>
    </radialGradient>
    <!-- Screen-print Fluorescent Green -->
    <linearGradient id="neon-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00aa55"/>
    </linearGradient>
    <filter id="disc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Disc Boundary (120mm CD) -->
  <circle cx="400" cy="400" r="380" fill="url(#disc-silver)" stroke="#4a657c" stroke-width="4"/>

  <!-- Radar Concentric Tracking Grooves -->
  <g stroke="#00ff88" stroke-width="1" fill="none" opacity="0.35">
    <circle cx="400" cy="400" r="340"/>
    <circle cx="400" cy="400" r="300"/>
    <circle cx="400" cy="400" r="260"/>
    <circle cx="400" cy="400" r="220"/>
    <circle cx="400" cy="400" r="180"/>
  </g>

  <!-- Clear Stacking Ring / Mirror Band (46mm) -->
  <circle cx="400" cy="400" r="140" fill="#0d1419" stroke="#334d5c" stroke-width="2"/>

  <!-- Center Spindle Hole (15mm) -->
  <circle cx="400" cy="400" r="50" fill="#000000" stroke="#557788" stroke-width="3"/>

  <!-- TOP HALF: Game Branding &amp; Logo -->
  <g transform="translate(400, 180)">
    <!-- Subtitle Banner -->
    <rect x="-170" y="-45" width="340" height="22" fill="#00ff88" opacity="0.9"/>
    <text x="0" y="-29" font-family="'Arial Black', Impact, sans-serif" font-size="12" font-weight="bold" fill="#0a1218" text-anchor="middle" letter-spacing="3">TACTICAL ESPIONAGE ACTION</text>

    <!-- Main Title -->
    <text x="0" y="25" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="52" fill="#ffffff" stroke="#000" stroke-width="3" text-anchor="middle" letter-spacing="4">PLATTYPUS</text>
    <text x="2" y="23" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="52" fill="#ffe680" text-anchor="middle" letter-spacing="4">PLATTYPUS</text>

    <text x="0" y="52" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="13" fill="#88c999" text-anchor="middle" letter-spacing="2">PROJECT PSOXIDE 3D // 32-BIT GTE</text>
  </g>

  <!-- LEFT: Official PlayStation Logo &amp; Licensing -->
  <g transform="translate(140, 370)">
    <!-- PlayStation Symbol -->
    <g transform="scale(0.8)">
      <path d="M25 10 L25 75 L45 75 L45 48 L58 48 C72 48 80 40 80 29 C80 18 72 10 58 10 Z M45 25 L56 25 C62 25 65 27 65 29 C65 32 62 34 56 34 L45 34 Z" fill="#df0024"/>
      <path d="M15 65 C25 62 38 62 48 65 C60 68 70 75 65 82 C60 88 42 88 30 84 C20 80 12 75 15 65 Z" fill="#f3c300" opacity="0.9"/>
      <path d="M45 68 C58 66 75 66 82 72 C88 77 82 85 68 87 C52 89 35 88 45 68 Z" fill="#00ac9f" opacity="0.9"/>
    </g>
    <text x="35" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">PlayStation®</text>
  </g>

  <!-- RIGHT: Compact Disc Digital Audio Logo -->
  <g transform="translate(580, 360)">
    <rect width="90" height="52" fill="#141f26" stroke="#00ff88" stroke-width="1.5" rx="4"/>
    <text x="45" y="20" font-family="'Arial Black', sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">COMPACT</text>
    <text x="45" y="34" font-family="'Arial Black', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">disc</text>
    <text x="45" y="46" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#00ff88" text-anchor="middle">DIGITAL AUDIO</text>
  </g>

  <!-- BOTTOM HALF: Serial, Specs &amp; Copyright Notices -->
  <g transform="translate(400, 580)">
    <!-- Serial &amp; Region Info -->
    <rect x="-140" y="-10" width="280" height="30" fill="#0a1218" stroke="#253c4d" stroke-width="1" rx="4"/>
    <text x="0" y="10" font-family="monospace" font-size="13" font-weight="bold" fill="#00ffcc" text-anchor="middle" letter-spacing="1">SERIAL: BASLUS-00001</text>
    
    <text x="0" y="38" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffe680" text-anchor="middle" letter-spacing="1">NTSC-U/C &amp; PAL AUTO-COMPLIANT // 50/60Hz</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="9" fill="#99b5c9" text-anchor="middle">BURROW COMMAND STUDIOS // MADE IN AUSTRALIA</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="8" fill="#668299" text-anchor="middle">© 2026 Burrow Command Studios. GPL-2.0-or-later. Non-commercial homebrew - not for sale. Not affiliated with or endorsed by Sony Computer Entertainment Inc.</text>
  </g>

  <!-- Outer Calibration Edge Ticks -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.5">
    <line x1="400" y1="20" x2="400" y2="35"/>
    <line x1="400" y1="765" x2="400" y2="780"/>
    <line x1="20" y1="400" x2="35" y2="400"/>
    <line x1="765" y1="400" x2="780" y2="400"/>
  </g>
</svg>
