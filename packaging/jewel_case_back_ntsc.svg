<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 786" width="1000" height="786">
  <defs>
    <linearGradient id="back-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1922"/>
      <stop offset="60%" stop-color="#141f26"/>
      <stop offset="100%" stop-color="#0b1218"/>
    </linearGradient>
    <linearGradient id="gold-title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <!-- Left Spine (40px) -->
  <rect x="0" y="0" width="40" height="786" fill="#000000"/>
  <rect x="38" y="0" width="2" height="786" fill="#222222"/>
  <g transform="translate(24, 730) rotate(-90)">
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="2">SLUS-00001</text>
    <text x="110" y="0" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#ffe680" letter-spacing="2">PLATTYPUS : TACTICAL ESPIONAGE ACTION</text>
  </g>

  <!-- Right Spine (40px) -->
  <rect x="960" y="0" width="40" height="786" fill="#000000"/>
  <rect x="960" y="0" width="2" height="786" fill="#222222"/>
  <g transform="translate(984, 730) rotate(-90)">
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="2">SLUS-00001</text>
    <text x="110" y="0" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#ffe680" letter-spacing="2">PLATTYPUS : TACTICAL ESPIONAGE ACTION</text>
  </g>

  <!-- Center Back Tray (920px) -->
  <rect x="40" y="0" width="920" height="786" fill="url(#back-bg)"/>

  <!-- Tactical Top Headline -->
  <g transform="translate(70, 45)">
    <text font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="url(#gold-title)" letter-spacing="3">THE DUCK-BILLED OPERATIVE HAS ARRIVED.</text>
    <text y="28" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#2eb85c" letter-spacing="2">32-BIT GTE STEALTH INFILTRATION // TACTICAL ESPIONAGE ACTION</text>
  </g>

  <!-- Narrative Summary Paragraph -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="70" fill="#14222b" rx="6" stroke="#253c4d" stroke-width="1.5"/>
    <text x="18" y="26" font-family="Arial, sans-serif" font-size="13" fill="#d8e6ef" line-height="1.5">
      The Australian wetlands face industrial devastation at the hands of the rogue syndicate and Dr. Cane Toad!
    </text>
    <text x="18" y="46" font-family="Arial, sans-serif" font-size="13" fill="#d8e6ef">
      As AGENT PLATTY, deploy Close Quarters Combat (CQC), echo-locate with the Electro-Sonar system, disguise yourself
    </text>
    <text x="18" y="66" font-family="Arial, sans-serif" font-size="13" fill="#88c999" font-weight="bold">
      beneath "The Bill Box", and swim through high-speed rapids to rescue baby sister Pip before zero hour!
    </text>
  </g>

  <!-- 3 Screenshot Panels with Authentic 4:3 PS1 aspect ratio frames -->
  <!-- Screenshot 1: Stealth & Lasers -->
  <g transform="translate(70, 210)">
    <rect width="265" height="185" fill="#080e12" stroke="#2eb85c" stroke-width="2" rx="4"/>
    <!-- Mock 3D scene preview -->
    <rect x="5" y="5" width="255" height="145" fill="#162822"/>
    <polygon points="50,150 130,50 210,150" fill="#244234"/>
    <circle cx="130" cy="90" r="14" fill="#7a4b24"/>
    <ellipse cx="140" cy="92" rx="10" ry="4" fill="#54585a"/>
    <line x1="20" y1="110" x2="240" y2="110" stroke="#ff3333" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Caption -->
    <rect x="5" y="152" width="255" height="28" fill="#101a1e"/>
    <text x="132" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">PERIMETER COMPOUND STEALTH</text>
  </g>

  <!-- Screenshot 2: 5-Lane River Rapids -->
  <g transform="translate(365, 210)">
    <rect width="265" height="185" fill="#080e12" stroke="#3399ff" stroke-width="2" rx="4"/>
    <!-- Mock River Runner preview -->
    <rect x="5" y="5" width="255" height="145" fill="#0d2b45"/>
    <path d="M 5 60 Q 65 50 130 65 T 260 55" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 5 110 Q 65 95 130 110 T 260 100" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="130" cy="115" r="16" fill="#7a4b24"/>
    <!-- Obstacles -->
    <rect x="50" y="80" width="30" height="14" fill="#805020" rx="3"/>
    <circle cx="210" cy="70" r="12" fill="#ff6600"/>
    <!-- Caption -->
    <rect x="5" y="152" width="255" height="28" fill="#101a1e"/>
    <text x="132" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">5-LANE HIGH-SPEED RIVER RAPIDS</text>
  </g>

  <!-- Screenshot 3: Multi-Frequency CODEC -->
  <g transform="translate(660, 210)">
    <rect width="265" height="185" fill="#080e12" stroke="#ffd700" stroke-width="2" rx="4"/>
    <!-- Mock CODEC preview -->
    <rect x="5" y="5" width="255" height="145" fill="#0a1a14"/>
    <rect x="15" y="25" width="50" height="50" fill="#204030" stroke="#00ff88" stroke-width="1.5"/>
    <rect x="195" y="25" width="50" height="50" fill="#204030" stroke="#00ff88" stroke-width="1.5"/>
    <text x="130" y="55" font-family="monospace" font-size="14" font-weight="bold" fill="#00ffcc" text-anchor="middle">140.85</text>
    <rect x="15" y="90" width="235" height="48" fill="#08140f" stroke="#008855" stroke-width="1"/>
    <!-- Caption -->
    <rect x="5" y="152" width="255" height="28" fill="#101a1e"/>
    <text x="132" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">MULTI-FREQUENCY CODEC RADIO</text>
  </g>

  <!-- Features Bullet Points & Mode Callouts -->
  <g transform="translate(70, 425)">
    <rect width="860" height="130" fill="#101820" rx="6" stroke="#1d2e3d" stroke-width="1"/>
    <g transform="translate(25, 28)">
      <circle cx="5" cy="5" r="4" fill="#00ff88"/>
      <text x="18" y="9" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">4 Full Infiltration Chapters:</text>
      <text x="210" y="9" font-family="Arial, sans-serif" font-size="13" fill="#c0d4df">12 Handcrafted Missions across Sanctuary, River Wilds, Melbourne & Surf!</text>

      <circle cx="5" cy="35" r="4" fill="#00ff88"/>
      <text x="18" y="39" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">VR Training Simulator:</text>
      <text x="180" y="39" font-family="Arial, sans-serif" font-size="13" fill="#c0d4df">4 Standalone Cyber Training Modules testing Sneaking, CQC, & Sonar!</text>

      <circle cx="5" cy="65" r="4" fill="#00ff88"/>
      <text x="18" y="69" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">MGS Codename Ranking:</text>
      <text x="200" y="69" font-family="Arial, sans-serif" font-size="13" fill="#c0d4df">Earn Big Platypus (Rank S) to unlock Stealth Camo, Tuxedos & 1994 Wireframe!</text>

      <circle cx="5" cy="95" r="4" fill="#00ff88"/>
      <text x="18" y="99" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Global TV Standards:</text>
      <text x="175" y="99" font-family="Arial, sans-serif" font-size="13" fill="#c0d4df">Auto PAL 50Hz / NTSC 60Hz detection with 5-Language Localization!</text>
    </g>
  </g>

  <!-- Technical Compatibility Badges (Official PSX Style) -->
  <g transform="translate(70, 580)">
    <!-- 1 Player -->
    <rect x="0" y="0" width="130" height="42" fill="#141c24" stroke="#253545" stroke-width="1"/>
    <text x="65" y="18" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7fa5bf" text-anchor="middle">PLAYERS</text>
    <text x="65" y="33" font-family="'Arial Black', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1 PLAYER</text>

    <!-- Memory Card -->
    <rect x="145" y="0" width="165" height="42" fill="#141c24" stroke="#253545" stroke-width="1"/>
    <text x="227" y="18" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7fa5bf" text-anchor="middle">MEMORY CARD</text>
    <text x="227" y="33" font-family="'Arial Black', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1 BLOCK</text>

    <!-- Analog Control -->
    <rect x="325" y="0" width="200" height="42" fill="#141c24" stroke="#253545" stroke-width="1"/>
    <text x="425" y="18" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7fa5bf" text-anchor="middle">ANALOG CONTROLLER</text>
    <text x="425" y="33" font-family="'Arial Black', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">COMPATIBLE</text>

    <!-- Vibration Function -->
    <rect x="540" y="0" width="190" height="42" fill="#141c24" stroke="#253545" stroke-width="1"/>
    <text x="635" y="18" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7fa5bf" text-anchor="middle">DUALSHOCK® VIBRATION</text>
    <text x="635" y="33" font-family="'Arial Black', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FUNCTION COMPATIBLE</text>
  </g>

  <!-- Legal Notice & UPC Barcode (Bottom Section) -->
  <g transform="translate(70, 650)">
    <!-- Legal disclaimer -->
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="8.5" fill="#668299">
      Burrow Command Studios, Victoria, Australia. PlayStation and the PlayStation logo are registered trademarks of Sony Computer Entertainment Inc.
    </text>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="8.5" fill="#668299">
      The ratings icon is a trademark of the Entertainment Software Association. All rights reserved. Made in Australia. Printed in U.S.A.
    </text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="8.5" fill="#668299">
      Licensed for play on PlayStation game consoles with NTSC-U/C or PAL designation. Unauthorized copying or broadcast is a violation of applicable laws.
    </text>

    <!-- Barcode Box -->
    <g transform="translate(680, 50)">
      <rect width="180" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <!-- Barcode Lines -->
      <g fill="#000000">
        <rect x="15" y="8" width="3" height="46"/>
        <rect x="22" y="8" width="2" height="46"/>
        <rect x="28" y="8" width="4" height="46"/>
        <rect x="36" y="8" width="2" height="46"/>
        <rect x="42" y="8" width="5" height="46"/>
        <rect x="52" y="8" width="2" height="46"/>
        <rect x="58" y="8" width="3" height="46"/>
        <rect x="65" y="8" width="6" height="46"/>
        <rect x="76" y="8" width="2" height="46"/>
        <rect x="82" y="8" width="4" height="46"/>
        <rect x="90" y="8" width="3" height="46"/>
        <rect x="98" y="8" width="5" height="46"/>
        <rect x="108" y="8" width="2" height="46"/>
        <rect x="114" y="8" width="4" height="46"/>
        <rect x="122" y="8" width="3" height="46"/>
        <rect x="130" y="8" width="6" height="46"/>
        <rect x="140" y="8" width="2" height="46"/>
        <rect x="146" y="8" width="4" height="46"/>
        <rect x="154" y="8" width="3" height="46"/>
        <rect x="162" y="8" width="3" height="46"/>
      </g>
      <text x="90" y="64" font-family="monospace" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">0 711719 000015</text>
    </g>

    <!-- Compact Disc Digital Audio Logo -->
    <g transform="translate(560, 55)">
      <rect width="90" height="48" fill="#141c24" stroke="#253545" stroke-width="1"/>
      <text x="45" y="20" font-family="'Arial Black', sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">COMPACT</text>
      <text x="45" y="32" font-family="'Arial Black', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">disc</text>
      <text x="45" y="42" font-family="Arial, sans-serif" font-size="6" fill="#88c999" text-anchor="middle">DIGITAL AUDIO</text>
    </g>
  </g>
</svg>
