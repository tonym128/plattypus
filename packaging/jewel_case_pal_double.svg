<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 786" width="1000" height="786">
  <defs>
    <linearGradient id="pal-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1324"/>
      <stop offset="50%" stop-color="#0e1d38"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="pal-stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#001844"/>
      <stop offset="100%" stop-color="#002d7a"/>
    </linearGradient>
    <linearGradient id="gold-title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="silver-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#9aa8b8"/>
    </linearGradient>
  </defs>

  <!-- Left Spine (PAL Double-case White/Black Spine with SLES-00001) -->
  <rect x="0" y="0" width="45" height="786" fill="#f4f6f8"/>
  <rect x="43" y="0" width="2" height="786" fill="#cccccc"/>
  <g transform="translate(26, 730) rotate(-90)">
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#000000" letter-spacing="2">SLES-00001</text>
    <text x="110" y="0" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#002266" letter-spacing="2">PLATTYPUS : TACTICAL ESPIONAGE ACTION</text>
    <!-- Classic PS family logo symbol on spine -->
    <text x="590" y="1" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#e60012">PS</text>
  </g>

  <!-- Right Spine (PAL Double-case White/Black Spine with SLES-00001) -->
  <rect x="955" y="0" width="45" height="786" fill="#f4f6f8"/>
  <rect x="955" y="0" width="2" height="786" fill="#cccccc"/>
  <g transform="translate(981, 730) rotate(-90)">
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#000000" letter-spacing="2">SLES-00001</text>
    <text x="110" y="0" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#002266" letter-spacing="2">PLATTYPUS : TACTICAL ESPIONAGE ACTION</text>
    <text x="590" y="1" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#e60012">PS</text>
  </g>

  <!-- Center Back Tray (910px) -->
  <rect x="45" y="0" width="910" height="786" fill="url(#pal-bg)"/>

  <!-- Top PAL Brand Banner with PlayStation Symbols -->
  <rect x="45" y="0" width="910" height="42" fill="url(#pal-stripe)"/>
  <g transform="translate(70, 26)">
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="4">PlayStation</text>
    <g transform="translate(160, -3)" fill="none" stroke="url(#silver-grad)" stroke-width="2" opacity="0.8">
      <!-- Triangle -->
      <polygon points="10,0 18,14 2,14" stroke="#00d084"/>
      <!-- Circle -->
      <circle cx="36" cy="7" r="7" stroke="#eb144c"/>
      <!-- Cross -->
      <line x1="50" y1="0" x2="64" y2="14" stroke="#0693e3"/>
      <line x1="64" y1="0" x2="50" y2="14" stroke="#0693e3"/>
      <!-- Square -->
      <rect x="74" y="0" width="14" height="14" stroke="#fcb900"/>
    </g>
    <text x="810" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="13" fill="#a0c0e8" letter-spacing="1">PAL 50Hz</text>
  </g>

  <!-- Main Title Headline -->
  <g transform="translate(70, 78)">
    <text font-family="'Arial Black', Impact, sans-serif" font-size="30" font-weight="900" fill="url(#gold-title)" letter-spacing="2">PLATTYPUS : TACTICAL ESPIONAGE ACTION</text>
    <text y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="13" fill="#4ade80" letter-spacing="2">ACTION D'ESPIONNAGE TACTIQUE // 32-BIT GTE HARDWARE ENGINE</text>
  </g>

  <!-- 3 Screenshot Panes -->
  <g transform="translate(70, 126)">
    <!-- Shot 1: Stealth Infiltration -->
    <g transform="translate(0, 0)">
      <rect width="270" height="154" fill="#0f2219" rx="4" stroke="#256b48" stroke-width="2"/>
      <rect x="4" y="4" width="262" height="146" fill="#0a1711"/>
      <!-- Simulated radar &amp; grid -->
      <circle cx="230" cy="35" r="24" fill="#00180a" stroke="#00ff66" stroke-width="1" opacity="0.6"/>
      <line x1="230" y1="11" x2="230" y2="59" stroke="#00ff66" stroke-width="0.8" opacity="0.5"/>
      <line x1="206" y1="35" x2="254" y2="35" stroke="#00ff66" stroke-width="0.8" opacity="0.5"/>
      <!-- Platty sneaking -->
      <ellipse cx="70" cy="115" rx="22" ry="12" fill="#5c381e"/>
      <ellipse cx="90" cy="116" rx="10" ry="4" fill="#2b2b2b"/>
      <rect x="52" y="108" width="28" height="4" fill="#00d084"/>
      <!-- Sentry cone -->
      <polygon points="170,75 240,110 240,40" fill="#ffd700" opacity="0.25"/>
      <circle cx="170" cy="75" r="7" fill="#888888"/>
      <rect x="0" y="128" width="270" height="26" fill="#06120b" opacity="0.9"/>
      <text x="10" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00ff88">ACT 1: SNEAK PAST GUARDS &amp; LASERS</text>
    </g>

    <!-- Shot 2: Rapids Surfing -->
    <g transform="translate(295, 0)">
      <rect width="270" height="154" fill="#0c1d30" rx="4" stroke="#1d4ed8" stroke-width="2"/>
      <rect x="4" y="4" width="262" height="146" fill="#081422"/>
      <!-- River lanes -->
      <line x1="60" y1="4" x2="40" y2="150" stroke="#1e3a5f" stroke-width="2"/>
      <line x1="110" y1="4" x2="90" y2="150" stroke="#1e3a5f" stroke-width="2"/>
      <line x1="160" y1="4" x2="140" y2="150" stroke="#1e3a5f" stroke-width="2"/>
      <line x1="210" y1="4" x2="190" y2="150" stroke="#1e3a5f" stroke-width="2"/>
      <!-- Platty diving -->
      <ellipse cx="130" cy="95" rx="18" ry="10" fill="#5c381e"/>
      <circle cx="130" cy="95" r="24" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
      <rect x="0" y="128" width="270" height="26" fill="#040b14" opacity="0.9"/>
      <text x="10" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#60a5fa">ACT 2: 5-LANE WATER RAPIDS RUNNER</text>
    </g>

    <!-- Shot 3: Boss Mech Battle -->
    <g transform="translate(590, 0)">
      <rect width="270" height="154" fill="#2b1414" rx="4" stroke="#dc2626" stroke-width="2"/>
      <rect x="4" y="4" width="262" height="146" fill="#170a0a"/>
      <!-- Searchlight mech -->
      <rect x="110" y="40" width="50" height="40" fill="#3f3f46" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="120" cy="55" r="8" fill="#ffd700"/>
      <circle cx="150" cy="55" r="8" fill="#ffd700"/>
      <!-- Dual beams -->
      <polygon points="120,60 40,130 90,130" fill="#ffffff" opacity="0.25"/>
      <polygon points="150,60 180,130 230,130" fill="#ffffff" opacity="0.25"/>
      <rect x="0" y="128" width="270" height="26" fill="#100505" opacity="0.9"/>
      <text x="10" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f87171">ACT 3 &amp; 4: 4 EPIC CONFRONTATIONS</text>
    </g>
  </g>

  <!-- PAL 5-Language Feature Description Section -->
  <g transform="translate(70, 305)">
    <rect width="860" height="260" fill="#081020" rx="6" stroke="#1d3052" stroke-width="1.5"/>

    <!-- English -->
    <g transform="translate(18, 22)">
      <rect width="24" height="14" fill="#00247d" rx="2"/>
      <text x="32" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffe680">EN</text>
      <text x="60" y="12" font-family="Arial, sans-serif" font-size="12" fill="#d1e0f0">
        Tactical espionage action meets Australian wildlife in full 3D! Master CQC, Soliton Radar, and stealth.
      </text>
    </g>

    <!-- French -->
    <g transform="translate(18, 70)">
      <rect width="24" height="14" fill="#002395" rx="2"/>
      <text x="32" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffe680">FR</text>
      <text x="60" y="12" font-family="Arial, sans-serif" font-size="12" fill="#d1e0f0">
        L'action d'espionnage tactique rencontre la faune australienne en 3D intégrale ! Infiltration et combat CQC.
      </text>
    </g>

    <!-- German -->
    <g transform="translate(18, 118)">
      <rect width="24" height="14" fill="#000000" rx="2"/>
      <text x="32" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffe680">DE</text>
      <text x="60" y="12" font-family="Arial, sans-serif" font-size="12" fill="#d1e0f0">
        Taktische Spionage-Action trifft auf australische Wildtiere in echtem 3D! Soliton-Radar und Nahkampf.
      </text>
    </g>

    <!-- Spanish -->
    <g transform="translate(18, 166)">
      <rect width="24" height="14" fill="#aa151b" rx="2"/>
      <text x="32" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffe680">ES</text>
      <text x="60" y="12" font-family="Arial, sans-serif" font-size="12" fill="#d1e0f0">
        ¡La acción de espionaje táctico se une a la fauna australiana en 3D completo! Domina el sigilo y la infiltración.
      </text>
    </g>

    <!-- Italian -->
    <g transform="translate(18, 214)">
      <rect width="24" height="14" fill="#009246" rx="2"/>
      <text x="32" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffe680">IT</text>
      <text x="60" y="12" font-family="Arial, sans-serif" font-size="12" fill="#d1e0f0">
        L'azione di spionaggio tattico incontra la fauna australiana in 3D! Radar Soliton e combattimento ravvicinato.
      </text>
    </g>
  </g>

  <!-- Technical Spec Strip &amp; Ratings -->
  <g transform="translate(70, 582)">
    <rect width="860" height="74" fill="#050a14" rx="4" stroke="#18263e" stroke-width="1.5"/>

    <!-- Compatibility Icons -->
    <g transform="translate(20, 20)">
      <!-- 1 Player -->
      <rect width="110" height="34" fill="#0c182c" rx="3" stroke="#253c5e" stroke-width="1"/>
      <text x="10" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">1 PLAYER</text>

      <!-- Memory Card -->
      <rect x="125" y="0" width="160" height="34" fill="#0c182c" rx="3" stroke="#253c5e" stroke-width="1"/>
      <text x="135" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">MEMORY CARD: 1 BLOCK</text>

      <!-- Analog / Vibration -->
      <rect x="300" y="0" width="180" height="34" fill="#0c182c" rx="3" stroke="#253c5e" stroke-width="1"/>
      <text x="310" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">ANALOG / DUALSHOCK</text>

      <!-- PAL 50Hz Standard -->
      <rect x="495" y="0" width="105" height="34" fill="#0c182c" rx="3" stroke="#253c5e" stroke-width="1"/>
      <text x="507" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PAL 50Hz</text>
    </g>

    <!-- Rating: NOT YET RATED. Nothing here has been submitted to PEGI. -->
    <g transform="translate(740, 12)">
      <rect width="90" height="34" fill="none" stroke="#556655" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="45" y="22" font-family="Arial, sans-serif" font-size="9" fill="#556655" text-anchor="middle">NOT YET RATED</text>
    </g>
  </g>

  <!-- Legal Publisher Footer &amp; Barcode -->
  <g transform="translate(70, 672)">
    <!-- Legal boilerplate -->
    <text font-family="Arial, sans-serif" font-size="9.5" fill="#718299">
      FOR HOME USE ONLY. "PlayStation" and the PlayStation logo are registered trademarks of Sony Interactive Entertainment Inc.
    </text>
    <text y="15" font-family="Arial, sans-serif" font-size="9.5" fill="#718299">
      PLATTYPUS: TACTICAL ESPIONAGE ACTION is developed in bare-metal Rust via PSoXide SDK. Unauthorised copying prohibited.
    </text>
    <text y="30" font-family="Arial, sans-serif" font-size="9.5" fill="#4ade80" font-weight="bold">
      NON-COMMERCIAL HOMEBREW // PAL INSERT LAYOUT REFERENCE (SLES-00001) // NOT FOR SALE
    </text>

    <!-- European EAN-13 Barcode -->
    <g transform="translate(680, -2)">
      <rect width="180" height="54" fill="#ffffff" rx="2"/>
      <!-- Barcode stripes -->
      <g fill="#000000">
        <rect x="14" y="6" width="3" height="34"/>
        <rect x="20" y="6" width="2" height="34"/>
        <rect x="25" y="6" width="4" height="34"/>
        <rect x="33" y="6" width="2" height="34"/>
        <rect x="38" y="6" width="5" height="34"/>
        <rect x="47" y="6" width="2" height="34"/>
        <rect x="53" y="6" width="3" height="34"/>
        <rect x="60" y="6" width="4" height="34"/>
        <rect x="68" y="6" width="2" height="34"/>
        <rect x="74" y="6" width="3" height="34"/>
        <rect x="80" y="6" width="5" height="34"/>
        <rect x="89" y="6" width="2" height="34"/>
        <rect x="94" y="6" width="4" height="34"/>
        <rect x="102" y="6" width="2" height="34"/>
        <rect x="108" y="6" width="3" height="34"/>
        <rect x="114" y="6" width="5" height="34"/>
        <rect x="123" y="6" width="2" height="34"/>
        <rect x="129" y="6" width="4" height="34"/>
        <rect x="136" y="6" width="3" height="34"/>
        <rect x="143" y="6" width="2" height="34"/>
        <rect x="148" y="6" width="4" height="34"/>
        <rect x="156" y="6" width="2" height="34"/>
        <rect x="162" y="6" width="3" height="34"/>
      </g>
      <!-- PLACEHOLDER - DO NOT PRINT. GS1 prefixes are issued per company. -->
      <text x="24" y="49" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#000000" letter-spacing="2">5 000000 000000</text>
    </g>
  </g>
</svg>
